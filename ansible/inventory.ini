# Target nodes. "local" provisions the machine Ansible runs on (e.g. a fresh WSL distro);
# "vm" is the Vagrant box from ansible/Vagrantfile. Run against one with: -l local  or  -l vm
[app]
local ansible_connection=local
# vm ansible_host=192.168.56.20 ansible_user=vagrant ansible_ssh_private_key_file=.vagrant/machines/default/virtualbox/private_key

[app:vars]
ansible_python_interpreter=/usr/bin/python3
