<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Line icons (Lucide style). Usage: th:replace="~{fragments/icons :: icon('calendar')}" -->
<svg th:fragment="icon(name)" class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" th:switch="${name}">
    <g th:case="'calendar'"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></g>
    <g th:case="'clock'"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></g>
    <g th:case="'check'"><path d="M20 6 9 17l-5-5"/></g>
    <g th:case="'check-circle'"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></g>
    <g th:case="'x-circle'"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6M9 9l6 6"/></g>
    <g th:case="'ban'"><circle cx="12" cy="12" r="10"/><path d="m4.9 4.9 14.2 14.2"/></g>
    <g th:case="'users'"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/></g>
    <g th:case="'swap'"><path d="m16 3 4 4-4 4M20 7H4M8 21l-4-4 4-4M4 17h16"/></g>
    <g th:case="'file'"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5Z"/><path d="M14 2v6h6M9 15h6M9 11h2"/></g>
    <g th:case="'paperclip'"><path d="m21.4 11-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/></g>
    <g th:case="'upload'"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></g>
    <g th:case="'search'"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></g>
    <g th:case="'plus'"><path d="M12 5v14M5 12h14"/></g>
    <g th:case="'list'"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></g>
    <g th:case="'chart'"><path d="M3 3v18h18"/><path d="M7 16v-5M12 16V8M17 16v-8"/></g>
    <g th:case="'shield'"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><path d="m9 12 2 2 4-4"/></g>
    <g th:case="'arrow-right'"><path d="M5 12h14M12 5l7 7-7 7"/></g>
    <g th:case="'arrow-left'"><path d="M19 12H5M12 19l-7-7 7-7"/></g>
    <g th:case="'menu'"><path d="M4 6h16M4 12h16M4 18h16"/></g>
    <g th:case="'logout'"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></g>
    <g th:case="'home'"><path d="m3 10 9-7 9 7v10a2 2 0 0 1-2 2h-4v-7H9v7H5a2 2 0 0 1-2-2Z"/></g>
    <g th:case="'map'"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></g>
    <g th:case="'globe'"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></g>
    <g th:case="'sun'"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></g>
    <g th:case="'heart'"><path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7Z"/><path d="M3.2 12h3.3l2-3 3 6 2-3h7.3"/></g>
    <g th:case="'award'"><circle cx="12" cy="8" r="6"/><path d="M15.5 12.9 17 22l-5-3-5 3 1.5-9.1"/></g>
    <g th:case="'briefcase'"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></g>
    <g th:case="'more'"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></g>
    <g th:case="'bolt'"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8Z"/></g>
    <g th:case="'edit'"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></g>
    <g th:case="'eye'"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></g>
    <g th:case="*"><circle cx="12" cy="12" r="9"/></g>
</svg>

<!-- Icon for a LeaveType enum value -->
<svg th:fragment="typeIcon(type)" th:replace="~{fragments/icons :: icon(${
        type.name() == 'CASUAL' ? 'sun' :
        type.name() == 'SICK' ? 'heart' :
        type.name() == 'EARNED' ? 'award' :
        type.name() == 'DUTY' ? 'briefcase' : 'more'})}"></svg>
</body>
</html>
