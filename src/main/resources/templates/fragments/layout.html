<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | Faculty Leave'">Faculty Leave</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:fragment="nav" class="topbar">
    <a class="brand" th:href="@{/dashboard}">Faculty Leave</a>
    <span class="env" id="env-badge" th:text="${appEnv} + ' · v' + ${appVersion}">local</span>
    <nav th:if="${currentUser != null}">
        <a id="nav-dashboard" th:href="@{/dashboard}">Dashboard</a>
        <a id="nav-leaves" th:href="@{/leaves}">Leave records</a>
        <a id="nav-new" th:unless="${isHod}" th:href="@{/leaves/new}">Apply for leave</a>
        <span class="user" id="current-user" th:text="${currentUser}">user</span>
        <form th:action="@{/logout}" method="post" class="inline">
            <button id="logout" type="submit" class="link">Log out</button>
        </form>
    </nav>
</header>

<div th:fragment="flash">
    <p class="alert ok" id="flash-success" th:if="${success}" th:text="${success}"></p>
    <p class="alert err" id="flash-error" th:if="${error}" th:text="${error}"></p>
</div>
</body>
</html>
