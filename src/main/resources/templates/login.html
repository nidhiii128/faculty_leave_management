<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Sign in')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main class="narrow">
    <h1>Sign in</h1>
    <p class="alert err" id="login-error" th:if="${param.error}">Invalid username or password.</p>
    <p class="alert ok" id="logout-msg" th:if="${param.logout}">You have been logged out.</p>
    <form th:action="@{/login}" method="post" class="card">
        <label for="username">Username</label>
        <input id="username" name="username" autofocus required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required>
        <button id="login-btn" type="submit">Sign in</button>
    </form>
    <p class="muted">Demo users: <code>faculty1</code>, <code>faculty2</code> (Faculty), <code>hod</code> (HOD).
        Password: <code>password</code></p>
</main>
</body>
</html>
