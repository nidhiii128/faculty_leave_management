<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Leave records')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<section class="page-hero">
    <div class="container">
        <div>
            <div class="crumbs"><a th:href="@{/dashboard}">Dashboard</a> / Leave records</div>
            <h1 id="page-title" th:text="${isHod} ? 'All leave records' : 'My leave records'">Leave records</h1>
            <p th:text="${isHod} ? 'Every request in the department. Open one to review it.' : 'Your requests and their current status.'">Records</p>
        </div>
        <a class="btn btn-gold" th:unless="${isHod}" th:href="@{/leaves/new}">
            <svg th:replace="~{fragments/icons :: icon('plus')}"></svg>New request</a>
    </div>
</section>

<main class="page">
    <div class="container">
        <div th:replace="~{fragments/layout :: flash}"></div>

        <form id="search-form" class="card filters" method="get" th:action="@{/leaves}">
            <div>
                <label for="q">Keyword</label>
                <input id="q" name="q" th:value="${q}" placeholder="Name, reason or department">
            </div>
            <div>
                <label for="status">Status</label>
                <select id="status" name="status">
                    <option value="">All</option>
                    <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}" th:selected="${s == selectedStatus}">PENDING</option>
                </select>
            </div>
            <div>
                <label for="type">Type</label>
                <select id="type" name="type">
                    <option value="">All</option>
                    <option th:each="t : ${leaveTypes}" th:value="${t}" th:text="${t.label}" th:selected="${t == selectedType}">Casual</option>
                </select>
            </div>
            <div style="flex:0 0 auto; display:flex; gap:8px">
                <button id="search-btn" type="submit"><svg th:replace="~{fragments/icons :: icon('search')}"></svg>Search</button>
                <a class="btn secondary" id="clear-search" th:href="@{/leaves}">Clear</a>
            </div>
        </form>

        <div class="card" style="padding:0; overflow:hidden">
            <div class="empty" id="no-results" th:if="${#lists.isEmpty(leaves)}">
                <svg th:replace="~{fragments/icons :: icon('search')}"></svg>No leave records found.
            </div>
            <div class="table-wrap" th:unless="${#lists.isEmpty(leaves)}">
                <table id="leave-table">
                    <thead>
                    <tr><th>#</th><th th:if="${isHod}">Faculty</th><th>Type</th><th>From</th><th>To</th><th>Days</th><th>Reason</th><th>Status</th></tr>
                    </thead>
                    <tbody>
                    <tr th:each="l : ${leaves}" th:id="'leave-row-' + ${l.id}">
                        <td><a th:href="@{/leaves/{id}(id=${l.id})}" th:text="${l.id}">1</a></td>
                        <td th:if="${isHod}" th:text="${l.facultyName}">Name</td>
                        <td th:text="${l.leaveType.label}">Casual</td>
                        <td th:text="${#temporals.format(l.startDate, 'dd MMM yyyy')}">start</td>
                        <td th:text="${#temporals.format(l.endDate, 'dd MMM yyyy')}">end</td>
                        <td th:text="${l.days}">1</td>
                        <td class="reason"><span th:text="${l.reason}">reason</span>
                            <span class="tag" th:if="${l.attachmentName}" title="Document attached"><svg th:replace="~{fragments/icons :: icon('paperclip')}"></svg>doc</span>
                            <span class="tag" th:if="${l.substituteName}" th:title="'Substitute: ' + ${l.substituteName}"><svg th:replace="~{fragments/icons :: icon('swap')}"></svg>sub</span>
                        </td>
                        <td><span class="badge status" th:classappend="${l.status}" th:text="${l.status}">PENDING</span></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
