spring.application.name=flms
server.port=${PORT:8080}

# Environment parameter: set APP_ENV=dev|staging|prod (Jenkins / Docker / Ansible pass this in)
app.environment=${APP_ENV:@app.env@}
app.version=@project.version@

# H2 database. In-memory by default; Docker/Ansible point DB_URL at a file so data survives restarts.
spring.datasource.url=${DB_URL:jdbc:h2:mem:flms;DB_CLOSE_DELAY=-1}
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Load demo users' sample leave records on an empty database
app.seed-data=${SEED_DATA:true}

# Health check used by Jenkins smoke test, Docker HEALTHCHECK and Ansible
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
info.app.name=Faculty Leave Management System
info.app.version=${app.version}
info.app.environment=${app.environment}
